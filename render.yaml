# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repository to GitHub, then in Render choose
#   New +  ->  Blueprint  ->  pick the repository.
#
# Notes
# -----
# * The free plan has an **ephemeral** filesystem, so SQLite and uploaded MP3s
#   are reset on every deploy or restart. The demo catalogue simply re-seeds
#   itself (~1 s), which is fine for sharing a link. To *persist uploads*,
#   upgrade to a paid instance and uncomment the `disk:` block.
# * Free instances also spin down after ~15 minutes of inactivity; the first
#   request afterwards takes a few seconds to wake up.
# * `api/Dockerfile` is provided as an alternative if you prefer a container.

services:
  - type: web
    name: openbeats-api
    runtime: python
    plan: free
    region: oregon
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      # --- Durable storage ---------------------------------------------------
      # DATABASE_URL is deliberately NOT declared here. A key listed in this file
      # is *managed by the Blueprint*, and Render discards values typed into the
      # Environment page for managed keys — which makes the dashboard unable to
      # set it. Leaving it out means the value you paste in
      # Dashboard → your service → Environment is the one that sticks.
      #
      # Set it there to a Supabase "Session pooler" URI, e.g.
      #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # With that in place, uploaded audio and cover art are stored in Postgres
      # and survive every deploy. See DEPLOY.md, step 5.
      #
      # Optional: a Supabase Storage bucket instead of blobs in the database
      # (roomier, served from Supabase's CDN). Uncomment to opt in.
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_SERVICE_KEY
      #   sync: false
      # - key: SUPABASE_BUCKET
      #   value: openbeats
      #
      # NOTE: DATA_DIR is also intentionally absent — on the free plan /data is
      # not writable, so the app uses a scratch directory inside the project.
      #
      # The demo catalogue is off: this is an upload-only library.
      - key: SEED_DEMO
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: CORS_ORIGINS
        value: "*"
    # Uncomment both lines after upgrading to a paid plan to persist data:
    # disk:
    #   name: openbeats-data
    #   mountPath: /data
    #   sizeGB: 5
