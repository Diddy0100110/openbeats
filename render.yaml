# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repository to GitHub, then in Render choose
#   New +  ->  Blueprint  ->  pick the repository.
#
# Notes
# -----
# * The free plan has an **ephemeral** filesystem, so SQLite and uploaded MP3s
#   are reset on every deploy or restart. The demo catalogue simply re-seeds
#   itself (~1 s), which is fine for sharing a link. To *persist uploads*,
#   upgrade to a paid instance and uncomment the `disk:` block.
# * Free instances also spin down after ~15 minutes of inactivity; the first
#   request afterwards takes a few seconds to wake up.
# * `api/Dockerfile` is provided as an alternative if you prefer a container.

services:
  - type: web
    name: openbeats-api
    runtime: python
    plan: free
    region: oregon
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      # --- Durable storage ---------------------------------------------------
      # One value is enough: with a Postgres database, uploads (audio + cover art)
      # are stored inside it and survive every deploy. `sync: false` makes Render
      # prompt for the value instead of keeping it in this public repository.
      - key: DATABASE_URL
        sync: false
      # Optional: a Supabase Storage bucket instead of blobs in the database.
      # Roomier (1 GB vs 500 MB) and served from Supabase's CDN. Leave unset to
      # keep everything in Postgres.
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_SERVICE_KEY
      #   sync: false
      # - key: SUPABASE_BUCKET
      #   value: openbeats
      #
      # NOTE: DATA_DIR is deliberately *not* set. On the free plan /data does not
      # exist and is not writable, so the app uses a directory inside the project
      # as a scratch area.
      # - key: DATA_DIR
      #   value: /data
      #
      # The demo catalogue is off: this is an upload-only library.
      - key: SEED_DEMO
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: CORS_ORIGINS
        value: "*"
    # Uncomment both lines after upgrading to a paid plan to persist data:
    # disk:
    #   name: openbeats-data
    #   mountPath: /data
    #   sizeGB: 5
